[package]
name = "sentinela-gui"
version.workspace = true
description = "Sentinela"
edition.workspace = true

[lib]
# O sufixo `_lib` evita conflito de nome com o binário no Windows.
name = "sentinela_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sentinela-core = { path = "../../crates/core" }
sentinela-desktop = { path = "../../crates/desktop" }
sentinela-mods = { path = "../../crates/mods" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
base64 = "0.22"
rayon.workspace = true
sysinfo.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true

[features]
# O `tauri build` ativa esta feature; um `cargo build --release` puro precisa passar
# `--features custom-protocol`, senão o app aponta para o devUrl (localhost:1420).
custom-protocol = ["tauri/custom-protocol"]
