[package]
name = "sentinela-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "sentinela_desktop"
path = "src/lib.rs"

[[bin]]
name = "sentinela-desktop"
path = "src/main.rs"

[dependencies]
dirs.workspace = true
serde.workspace = true
toml.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_HiDpi"] }

[dev-dependencies]
tempfile.workspace = true
