[package]
name = "sentinela-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "sentinela_desktop"
path = "src/lib.rs"

[[bin]]
name = "sentinela-desktop"
path = "src/main.rs"

[dependencies]
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Media_Control", "Foundation", "Win32_UI_Accessibility", "Win32_System_Com"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3"
