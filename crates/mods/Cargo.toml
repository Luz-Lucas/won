[package]
name = "sentinela-mods"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sentinela-mods"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
goblin.workspace = true
pdb = "0.8"
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
toml.workspace = true
ureq.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
goblin.workspace = true
