[workspace]
members = ["crates/core", "crates/cli", "crates/desktop", "crates/mods", "crates/mods-testdll", "crates/mod-labels", "crates/mod-icons", "crates/mod-theme", "crates/mod-xaml", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
globset = "0.4.20"
goblin = "0.10.7"
hex = "0.4.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.39.6"
thiserror = "2.0.21"
ureq = { version = "3.5.0", features = ["rustls"] }
walkdir = "2.5.0"
base64 = "0.22.1"
getrandom = "0.3.4"
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
yara-x = "1.22.0"
zip = "9.0.5"
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "display"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Restore", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
